services:
  # Night City Blockchain (Ganache - local Ethereum)
  # The credstick ledger runs on this chain
  blockchain:
    image: trufflesuite/ganache:latest
    container_name: night-city-blockchain
    ports:
      - "8545:8545"    # JSON-RPC
    command:
      - --chain.chainId=2077
      - --wallet.totalAccounts=10
      - --wallet.defaultBalance=1000000
      - --miner.blockGasLimit=30000000
      - --chain.hardfork=london
      - --database.dbPath=/data
    volumes:
      - blockchain-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL for Temporal persistence
  postgresql:
    image: postgres:16-alpine
    container_name: temporal-patterns-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Temporal server (all-in-one for development)
  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: temporal-patterns-server
    ports:
      - "7233:7233"   # gRPC frontend
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: temporal-patterns-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  postgres-data:
  blockchain-data:

